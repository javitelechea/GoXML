# Compila GoXML y actualiza site/ (HTML+JS listo, como SimpleReplay).
name: Publish site folder

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: |
          rm -rf site
          mkdir -p site
          cp -R dist/. site/

      - name: Commit site/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --staged --quiet && exit 0
          git commit -m "chore: actualizar site/ para Cloudflare"
          git push
